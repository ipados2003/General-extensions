<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sites actuels</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="wrap">
    <section id="siteTabs" class="siteTabs" hidden aria-label="Sections du site enregistré">
      <div class="tabList" role="tablist" aria-label="Sections du site">
        <button id="mainTab" class="tabButton isActive" type="button" role="tab" aria-selected="true"
          aria-controls="mainPanel">Main</button>
        <button id="imageScrollTab" class="tabButton" type="button" role="tab" aria-selected="false"
          aria-controls="imageScrollPanel">Image Scroll</button>
        <button id="videoTab" class="tabButton" type="button" role="tab" aria-selected="false"
          aria-controls="videoPanel">Video Control</button>
      </div>
    </section>

    <section id="mainPanel" class="tabPanel" role="tabpanel" aria-labelledby="mainTab">
      <h1 class="title">Sites actuels</h1>

      <div class="row">
        <span class="label">URL de la page</span>
        <a id="pageUrl" class="value link" rel="noreferrer">Chargement…</a>
      </div>

      <div class="actions">
        <button id="saveBtn" class="btn" type="button">Enregistrer Site</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>

      <p id="error" class="error" hidden></p>
    </section>
    <section id="imageScrollPanel" class="tabPanel" role="tabpanel" aria-labelledby="imageScrollTab" hidden></section>
    <section id="videoPanel" class="tabPanel" role="tabpanel" aria-labelledby="videoTab" hidden></section>
  </main>

  <script src="popup.js"></script>
</body>

</html>
